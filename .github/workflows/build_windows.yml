# Build the Windows release artifact in public.
#
# The point of this workflow is trust, not convenience. This project asks
# strangers to run an UNSIGNED .exe and hand it EVE SSO access — which is the
# exact profile of every account-stealing tool that has ever circulated in EVE.
# Building here means the binary is produced from public source, by a public
# run, with a log anyone can read. That is worth more to a cautious player than
# anything the README can claim.
#
# Never move this to a self-hosted runner and never upload a locally built exe
# to a release. The moment the binary comes from a machine nobody can inspect,
# the guarantee is gone and there is no way to tell from the outside.

name: build-windows

on:
  push:
    tags: ["v*"]          # a tag publishes a release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # needed to create the release on tag pushes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OverlayMVP/OverlayMVP.csproj

      - name: Build
        run: dotnet build OverlayMVP/OverlayMVP.csproj -c Release --no-restore

      # The version in the csproj is the single source of truth: publish.ps1
      # names the artifact from it and the in-app update check compares against
      # it. A tag that disagrees would tell every user to "update" to the build
      # they already have, so fail loudly instead of shipping that.
      - name: Check tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$xml = Get-Content OverlayMVP/OverlayMVP.csproj
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "csproj=$version  tag=$tag"
          if ($version -ne $tag) {
            throw "tag v$tag does not match <Version>$version</Version> in the csproj"
          }

      - name: Publish single-file artifact
        shell: pwsh
        run: pwsh tools/publish.ps1

      - name: Record the SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/CryonicOverlay-*-win-x64.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "artifact : $($exe.Name)"
          Write-Host "size     : $size MB"
          Write-Host "sha256   : $hash"
          # Into the job summary so it is readable without digging through logs —
          # this is the number a cautious player compares against.
          "## $($exe.Name)"           | Out-File $env:GITHUB_STEP_SUMMARY -Append
          ""                          | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- size: $size MB"          | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- SHA-256: ``$hash``"      | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: CryonicOverlay-win-x64
          path: dist/CryonicOverlay-*-win-x64.exe
          if-no-files-found: error

      # Draft, not published: the release notes are written by hand per version
      # and live in docs/. This attaches the binary and leaves the text to you.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: dist/CryonicOverlay-*-win-x64.exe
          generate_release_notes: false
